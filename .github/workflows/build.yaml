name: Build

# Builds the add-on image for each architecture and publishes it to GitHub Container Registry,
# so Home Assistant installs pull a ready-made image instead of building on the user's machine.
# Publishes on pushes to main that change the add-on; pull requests only build (no push).

on:
  push:
    branches: [main]
    paths: ["tv_ready/**", ".github/workflows/build.yaml"]
  pull_request:
    paths: ["tv_ready/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.20
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: info
        run: |
          echo "version=$(grep -E '^version:' tv_ready/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: tv_ready
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ matrix.base }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.info.outputs.owner }}/${{ matrix.arch }}-addon-tv_ready:${{ steps.info.outputs.version }}
            ghcr.io/${{ steps.info.outputs.owner }}/${{ matrix.arch }}-addon-tv_ready:latest
          labels: |
            io.hass.name=TV Ready
            io.hass.description=Converts your video library off-peak so every file plays cleanly on your TV
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
